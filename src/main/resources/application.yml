spring:
  application:
    name: data-extraction-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

pagination:
  defaultLimit: 1000
  maxLimit: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
